<div class="card mb-3">
  <div class="card-body">
    <h5 class="card-title">{{ trip.name }}</h5>
    <p class="mb-1"><strong>Code:</strong> {{ trip.code }}</p>
    <p class="mb-1"><strong>Length:</strong> {{ trip.length }}</p>
    <p class="mb-1"><strong>Start:</strong> {{ trip.start }}</p>
    <p class="mb-1"><strong>Resort:</strong> {{ trip.resort }}</p>
    <p class="mb-1"><strong>Per Person:</strong> {{ trip.perPerson }}</p>
    <p class="mb-2">{{ trip.description }}</p>

    <ng-container *ngIf="authService.isLoggedIn()">
      <a class="btn btn-primary btn-sm me-2" [routerLink]="['/trips/edit', trip.code]">Edit</a>
      <button class="btn btn-danger btn-sm" (click)="onDelete()">Delete</button>
    </ng-container>
  </div>
</div>
